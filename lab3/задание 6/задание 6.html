<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Задание 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="#" class="register-form" method="post">
        <input type="text" placeholder="Ваше имя" name="name" class="form-input">
        <input type="email" placeholder="Ваш e-mail" name="email" class="form-input">
        <input type="tel" placeholder="Ваш телефон" name="phone" class="form-input">
        <input type="password" placeholder="Пароль" name="password" class="form-input">
        <input type="password" placeholder="Пароль еще раз" name="password_confirm" class="form-input">
        <button class="submit-btn" type="submit">Регистрация</button>
    </form>
</body>
</html>
